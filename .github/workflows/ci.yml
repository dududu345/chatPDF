
name: ChatPDF CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check syntax
        run: python -m compileall -q app.py new-app.py

      - name: Run tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/
